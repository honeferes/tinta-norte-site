<style>
:root{--ink:#1B2A4A;--ink2:#101A30;--amber:#E8A33D;--ivory:#F7F3EA;--slate:#5A6472;--white:#fff;--line:#EAE3D2}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--ivory);line-height:1.6}
h1,h2,h3{font-family:Georgia,'Playfair Display',serif;line-height:1.2}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.kicker{display:block;text-align:center;font-size:.78rem;letter-spacing:.22em;color:var(--amber);font-weight:700;margin-bottom:14px;text-transform:uppercase}
/* header */
header{background:var(--ink);color:var(--ivory);padding:14px 0;position:sticky;top:0;z-index:10}
header .wrap{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ivory)}
.brand img{height:40px;width:40px;border-radius:10px;display:block}.brand img.lockup{height:46px;width:auto;border-radius:0}
.brand .word{font-family:Georgia,serif;font-size:1.35rem;font-weight:bold;line-height:1}
.brand .word span{color:var(--amber)}
.brand small{display:block;font-family:'Inter',sans-serif;font-size:.6rem;letter-spacing:.28em;color:#C9D2E0;font-weight:400;margin-top:3px}
nav a{color:var(--ivory);text-decoration:none;margin-left:22px;font-size:.92rem}
nav a:hover{color:var(--amber)}
nav a.cta{background:var(--amber);color:var(--ink);padding:10px 20px;border-radius:6px;font-weight:700}
nav a.cta:hover{color:var(--ink)}
/* hero */
.hero{background:var(--ink);color:var(--ivory);padding:104px 0 96px;text-align:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(232,163,61,.13) 1px,transparent 1.6px);background-size:30px 30px;pointer-events:none}
.hero .wrap{position:relative}
.hero h1{font-size:3.1rem;max-width:820px;margin:0 auto 22px}
.hero h1 em{color:var(--amber);font-style:normal}
.hero p.lead{font-size:1.2rem;color:#C9D2E0;max-width:660px;margin:0 auto 38px}
.btn{display:inline-block;background:var(--amber);color:var(--ink);padding:15px 34px;border-radius:8px;font-weight:800;text-decoration:none;font-size:1.05rem}
.btn.ghost{background:transparent;color:var(--ivory);border:2px solid var(--amber);margin-left:12px}
.trust{margin-top:26px;font-size:.85rem;color:#8A94A6;letter-spacing:.04em}
/* chips */
.trades{background:var(--ink2);color:var(--ivory);padding:34px 0;text-align:center}
.trades .kicker{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border:1px solid rgba(232,163,61,.45);color:var(--ivory);padding:8px 18px;border-radius:999px;font-size:.9rem;letter-spacing:.02em}
/* stats */
.stats{background:var(--white);padding:56px 0;border-bottom:1px solid var(--line)}
.stats .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;text-align:center}
.stat b{font-size:2.4rem;color:var(--ink);display:block;font-family:Georgia,serif}
.stat b em{color:var(--amber);font-style:normal}
.stat p{color:var(--slate);font-size:.95rem}
/* sections */
section{padding:80px 0}
h2.sec{font-size:2.1rem;text-align:center;margin-bottom:14px}
.sub{text-align:center;color:var(--slate);max-width:640px;margin:0 auto 48px}
/* anatomy */
.anatomy-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.anatomy-copy .kicker{text-align:left}
.anatomy-copy h2{font-size:2.1rem;margin-bottom:16px}
.anatomy-copy p{color:var(--slate);margin-bottom:22px}
.anatomy-copy ul{list-style:none}
.anatomy-copy li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.97rem}
.anatomy-copy li b{color:var(--ink)}
.anatomy-copy li span{color:var(--slate)}
.doc{background:var(--white);border-radius:14px;box-shadow:0 24px 60px rgba(27,42,74,.14);overflow:hidden;border:1px solid var(--line)}
.doc-head{background:var(--ink);color:var(--ivory);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.doc-head b{font-family:Georgia,serif;letter-spacing:.06em;font-size:.95rem}
.doc-head span{font-size:.72rem;letter-spacing:.2em;color:var(--amber)}
.doc-row{display:flex;justify-content:space-between;gap:16px;padding:13px 24px;border-bottom:1px solid #F0EADC;font-size:.9rem}
.doc-row:last-child{border-bottom:none}
.doc-row .k{color:var(--slate);flex-shrink:0}
.doc-row .v{color:var(--ink);font-weight:600;text-align:right}
.doc-cap{text-align:center;color:var(--slate);font-size:.85rem;margin-top:14px;font-style:italic}
/* plans */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.plan{background:var(--white);border-radius:12px;padding:36px 30px;border:2px solid var(--line);display:flex;flex-direction:column}
.plan.hot{border-color:var(--amber);box-shadow:0 12px 40px rgba(232,163,61,.18);transform:scale(1.03)}
.plan h3{font-size:1.4rem;margin-bottom:6px}
.plan .price{font-size:2.2rem;font-family:Georgia,serif;margin:12px 0 4px}
.plan .price small{font-size:.95rem;color:var(--slate);font-family:inherit}
.plan ul{list-style:none;margin:20px 0 28px;flex:1}
.plan li{padding:8px 0;border-bottom:1px solid #F0EADC;font-size:.95rem}
.plan li:before{content:"✓ ";color:var(--amber);font-weight:bold}
.plan .btn{text-align:center;margin-top:auto}
/* how */
.how{background:var(--white)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:8px}
.step{text-align:center;padding:0 8px}
.step .n{width:52px;height:52px;background:var(--ink);color:var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;margin:0 auto 16px;font-family:Georgia,serif}
.step p{color:var(--slate);font-size:.93rem}
/* guarantee */
.guarantee{background:var(--ink);color:var(--ivory);text-align:center;padding:72px 0;position:relative;overflow:hidden}
.guarantee:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(232,163,61,.1) 1px,transparent 1.6px);background-size:30px 30px;pointer-events:none}
.guarantee .wrap{position:relative}
.guarantee h2{font-size:2rem;margin-bottom:16px}
.guarantee h2 em{color:var(--amber);font-style:normal}
.guarantee p{color:#C9D2E0;max-width:600px;margin:0 auto}
/* faq */
.faq{max-width:720px;margin:0 auto}
.faq details{background:var(--white);border-radius:8px;padding:18px 22px;margin-bottom:12px;border:1px solid var(--line)}
.faq summary{font-weight:700;cursor:pointer}
.faq p{margin-top:10px;color:var(--slate);font-size:.95rem}
/* final cta */
.cta-final{background:var(--ink2);color:var(--ivory);text-align:center;padding:88px 0}
.cta-final h2{font-size:2.2rem;margin-bottom:16px}
.cta-final h2 em{color:var(--amber);font-style:normal}
.cta-final p{color:#C9D2E0;margin-bottom:32px}
footer{background:#0B1226;color:#8A94A6;text-align:center;padding:28px 0;font-size:.85rem}
footer .word{font-family:Georgia,serif;color:#C9D2E0;font-size:1rem}
footer .word span{color:var(--amber)}
@media(max-width:860px){.anatomy-grid{grid-template-columns:1fr}}
@media(max-width:800px){.plans,.stats .grid,.steps{grid-template-columns:1fr}.hero h1{font-size:2.1rem}.plan.hot{transform:none}nav a:not(.cta):not(.lang){display:none}
nav{margin-left:auto}
nav a.lang{border:1px solid rgba(232,163,61,.65);border-radius:6px;padding:7px 11px;font-size:.8rem;margin-left:8px;white-space:nowrap}
nav a.cta{padding:9px 13px;font-size:.8rem;margin-left:8px;white-space:nowrap}
header{padding:10px 0}
.brand{gap:9px}
.brand img{height:34px;width:34px;border-radius:8px}.brand img.lockup{height:34px;width:auto;border-radius:0}
.brand .word{font-size:1.05rem}
.brand small{display:none}
.btn{display:block;max-width:340px;margin:0 auto 12px}
.btn.ghost{margin-left:auto}}
/* narrow phones: tighten header so ES toggle + CTA never clip (320-430px) */
@media(max-width:430px){header .wrap{padding:0 10px}.brand .word{font-size:.9rem}nav a.lang{padding:5px 8px;font-size:.7rem;margin-left:6px}nav a.cta{padding:7px 8px;font-size:.7rem;margin-left:6px}}

/* about */
.about{background:var(--ivory)}
.about-grid{display:grid;grid-template-columns:220px 1fr;gap:52px;align-items:center;max-width:880px;margin:0 auto}
.about-mono{width:220px;height:220px;border-radius:50%;background:var(--ink);color:var(--amber);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:4.2rem;border:3px solid var(--amber);flex-shrink:0}
.about-photo{width:220px;height:220px;border-radius:50%;object-fit:cover;border:3px solid var(--amber);flex-shrink:0}
@media(max-width:700px){.about-grid{grid-template-columns:1fr;gap:24px;justify-items:center}.about-photo{width:160px;height:160px}}
.about-copy .kicker{text-align:left}
.about-copy h2{font-size:2rem;margin-bottom:18px}
.about-copy p{color:var(--slate);margin-bottom:16px}
.about-copy p b{color:var(--ink)}

/* whatsapp float */
.wa-float{position:fixed;bottom:24px;right:24px;width:60px;height:60px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:50;transition:transform .15s}
.wa-float:hover{transform:scale(1.07)}
.wa-float svg{width:32px;height:32px;fill:#fff}

/* contact form */
.contact-form{max-width:640px;margin:0 auto;text-align:left}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.contact-form input,.contact-form textarea{width:100%;padding:13px 15px;border-radius:8px;border:1px solid rgba(201,210,224,.35);background:rgba(255,255,255,.07);color:var(--ivory);font:inherit;font-size:.95rem}
.contact-form input::placeholder,.contact-form textarea::placeholder{color:#8A94A6}
.contact-form textarea{margin:12px 0 0;resize:vertical;min-height:84px}
.contact-form .btn{width:100%;margin:16px 0 0;border:0;cursor:pointer;font-family:'Inter',sans-serif}
.contact-form .btn:disabled{opacity:.6;cursor:wait}
.form-ok{display:none;background:#1E4634;color:#B9F0D2;border:1px solid #2E7D52;padding:14px 18px;border-radius:8px;margin:16px 0 0!important;text-align:center}
.form-err{display:none;background:#4A1F1F;color:#F0B9B9;border:1px solid #8A3A3A;padding:14px 18px;border-radius:8px;margin:16px 0 0!important;text-align:center}
.or{margin:20px 0 14px!important;font-size:.9rem}
.chat-link{margin:20px 0 0!important}
.chat-link a{color:var(--amber);font-weight:700}
.micro{font-size:.8rem;color:#8A94A6;margin:14px 0 0!important}
.wa-btn{background:#25D366;color:#0B2E1C!important}
.contact-alt{margin:16px 0 0!important;font-size:.9rem}
.contact-alt a{color:var(--amber)}
/* plan badge */
.plan{position:relative}
.badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--amber);color:var(--ink);font-size:.7rem;font-weight:800;letter-spacing:.1em;padding:5px 14px;border-radius:99px;text-transform:uppercase;white-space:nowrap}
/* sources */
.src{font-size:.78rem;color:var(--slate);text-align:center;margin:16px auto 0;max-width:700px}
.src a{color:var(--slate)}
/* footer legal */
footer a{color:#C9D2E0}
/* about linkedin */
.about-link{margin-top:14px}
.about-link a{color:var(--amber);font-weight:700;text-decoration:none}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
</style>
<style>
.post-list{max-width:760px;margin:0 auto}
.post-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 28px;margin-bottom:20px}
.post-item h3{font-size:1.35rem;margin-bottom:6px}
.post-item h3 a{color:var(--ink);text-decoration:none}
.post-item h3 a:hover{color:var(--amber)}
.post-meta{color:var(--slate);font-size:.85rem;margin-bottom:10px}
.post-wrap{max-width:760px;margin:0 auto}
.post-wrap h1{font-size:2.1rem;margin-bottom:10px}
.post-body p{margin-bottom:16px}
.post-body h2{margin:26px 0 10px}
</style>
